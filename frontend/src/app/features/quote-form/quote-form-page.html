<main class="page" [attr.aria-busy]="status() === 'loading' ? 'true' : null">
  <h1 #heading tabindex="-1">Tus datos y los de tu vehículo</h1>
  @switch (status()) {
    @case ('loading') {
      <p role="status">Cargando formulario…</p>
    }
    @case ('error') {
      <app-load-error message="No pudimos cargar el formulario. Intenta de nuevo." (retry)="load()" />
    }
    @case ('ready') {
      @if (country) {
        <app-quote-form [configs]="configs()" [countryCode]="country.code" />
      }
    }
  }
</main>
