<main class="country-page" [attr.aria-busy]="countries.status() === 'loading' ? 'true' : null">
  <h1 tabindex="-1">Elige tu país</h1>
  @switch (countries.status()) {
    @case ('error') {
      <app-load-error message="No pudimos cargar la lista de países. Intenta de nuevo." (retry)="retry()" />
    }
    @case ('ready') {
      <ul class="country-page__list">
        @for (country of countries.countries(); track country.code) {
          <li><a [routerLink]="['/', country.code.toLowerCase(), 'datos']">{{ country.name }}</a></li>
        }
      </ul>
    }
    @default {
      <p role="status">Cargando…</p>
    }
  }
</main>
